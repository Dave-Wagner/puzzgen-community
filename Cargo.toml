[package]
name = "puzzgen"
version = "0.1.0"
edition = "2024"
description = "Deterministic puzzle generation API and all-Rust web playground"
license = "MIT"

[workspace]
members = [".", "frontend", "apps/android/game", "apps/android/native", "apps/android/weather", "apps/android/progression"]
default-members = ["."]
resolver = "3"
exclude = ["third_party/bevy_render", "third_party/bevy_pbr", "third_party/wgpu-hal"]

[patch.crates-io]
bevy_render = { path = "third_party/bevy_render" }
bevy_pbr = { path = "third_party/bevy_pbr" }
wgpu-hal = { path = "third_party/wgpu-hal" }

[dependencies]
argon2 = "0.5"
hex = "0.4"
jsonwebtoken = { version = "9.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
axum = "0.8"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Fast, bounded-memory builds for emulator compatibility/layout checks.
[profile.emulator]
inherits = "dev"
opt-level = 1
debug = 0
lto = false
codegen-units = 4
incremental = false
