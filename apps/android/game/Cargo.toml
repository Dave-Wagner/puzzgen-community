[package]
name = "puzzgen-game"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "HtmlAudioElement", "HtmlMediaElement", "RequestCredentials"] }

[dev-dependencies]
puzzgen = { path = "../../.." }
